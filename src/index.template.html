<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d1830">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>像素合成工坊</title>
<style>/*CSS*/</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="lvbox" class="panel"><b id="lv">Lv1</b><div class="xpbar"><i id="xpfill"></i></div></div>
    <div class="res panel" id="rCoin"><span class="ic" id="icCoin"></span><b id="coin">0</b></div>
    <div class="res panel" id="rGem"><span class="ic" id="icGem"></span><b id="gem">0</b></div>
    <div class="res panel" id="rEn"><span class="ic" id="icEn"></span><b id="en">0</b><button class="plus" id="enPlus" title="免费加体力">+</button></div>
    <button class="btn sq" id="menuBtn">☰</button>
  </header>
  <section id="orders"></section>
  <main id="stageBox">
    <div id="stageWrap"><div id="stage"><canvas id="board"></canvas><canvas id="fxc"></canvas></div></div>
    <div id="zoomPill"><button id="zoomOut">−</button><button id="zoomVal">100%</button><button id="zoomIn">+</button></div>
  </main>
  <footer id="bar">
    <div id="info" class="panel"></div>
    <div id="btns">
      <button class="btn" id="bShop"><i>🛒</i>商店</button>
      <button class="btn" id="bDex"><i>📖</i>图鉴</button>
      <button class="btn" id="bSort"><i>🧹</i>整理</button>
      <button class="btn" id="bHint"><i>💡</i>提示</button>
      <button class="btn" id="bRow"><i>➕</i>+格子</button>
      <button class="btn" id="bSlot"><i>📦</i>+应急</button>
    </div>
  </footer>
</div>
<div id="toasts"></div>
<div id="modal" class="hidden"><div class="mbox panel"><div class="mhead"><b id="mtitle"></b><button class="btn sq" id="mclose">✕</button></div><div id="mbody"></div></div></div>
<script>/*JS*/</script>
</body>
</html>
